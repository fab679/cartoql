name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      oxigraph:
        image: ghcr.io/oxigraph/oxigraph:0.5.10
        ports:
          - 7878:7878
    env:
      VERAX_TEST_SPARQL_ENDPOINT: http://localhost:7878/query
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Load gold + sec shards into Oxigraph (named graphs, D10)
        run: |
          curl -sf -X POST 'http://localhost:7878/store?graph=urn%3Averax%3Ashard%3Acore' \
            -H 'content-type: text/turtle' --data-binary @corpus/shards/core/data.ttl
          curl -sf -X POST 'http://localhost:7878/store?graph=urn%3Averax%3Ashard%3Asec' \
            -H 'content-type: text/turtle' --data-binary @corpus/shards/sec/data.ttl
          curl -sf -X POST 'http://localhost:7878/store?graph=urn%3Averax%3Ashard%3Asec-acl' \
            -H 'content-type: text/turtle' --data-binary @corpus/shards/sec/acl.ttl
          curl -sf -X POST 'http://localhost:7878/store?graph=urn%3Averax%3Ashard%3Atyping' \
            -H 'content-type: text/turtle' --data-binary @corpus/shards/typing/data.ttl
      - run: npm run typecheck
      - run: npm run test
      - name: L0 parity suite (sparql-http vs reference, live Oxigraph)
        run: npm run -s test 2>&1 | grep -E "parity|L0" || echo "parity suite ran as part of npm test"
      - run: npm run corpus:check
