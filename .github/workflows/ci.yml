name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # corpus integrity runs inside `npm test` (testkit package); kept explicit here
      # so the CI log reads in the order the docs define: contract → corpus.
      - run: npm run corpus:check