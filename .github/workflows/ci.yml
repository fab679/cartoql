name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      oxigraph:
        image: ghcr.io/oxigraph/oxigraph:0.5.10
        ports:
          - 7878:7878
      fuseki:
        image: stain/jena-fuseki:latest
        env:
          ADMIN_PASSWORD: admin
        ports:
          - 3030:3030
    env:
      CARTOQL_TEST_SPARQL_ENDPOINT: http://localhost:7878/query
      CARTOQL_TEST_SPARQL_ENDPOINTS: http://localhost:7878/query,http://localhost:3030/test/query
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Provision Fuseki dataset + named graphs (retries — services race)
        run: |
          for i in $(seq 1 20); do
            curl -sf -X POST --user admin:admin http://localhost:3030/$/datasets \
              -d "dbName=test" -d "dbType=tdb2" -o /dev/null && break || sleep 5
          done
          curl -sf --user admin:admin -X POST "http://localhost:3030/test/data?graph=urn%3Acartoql%3Ashard%3Acore" \
            -H 'content-type: text/turtle' --data-binary @corpus/shards/core/data.ttl
          curl -sf --user admin:admin -X POST "http://localhost:3030/test/data?graph=urn%3Acartoql%3Ashard%3Atyping" \
            -H 'content-type: text/turtle' --data-binary @corpus/shards/typing/data.ttl
      - name: Load gold + sec shards into Oxigraph (named graphs, D10)
        run: |
          curl -sf -X POST 'http://localhost:7878/store?graph=urn%3Acartoql%3Ashard%3Acore' \
            -H 'content-type: text/turtle' --data-binary @corpus/shards/core/data.ttl
          curl -sf -X POST 'http://localhost:7878/store?graph=urn%3Acartoql%3Ashard%3Asec' \
            -H 'content-type: text/turtle' --data-binary @corpus/shards/sec/data.ttl
          curl -sf -X POST 'http://localhost:7878/store?graph=urn%3Acartoql%3Ashard%3Asec-acl' \
            -H 'content-type: text/turtle' --data-binary @corpus/shards/sec/acl.ttl
          curl -sf -X POST 'http://localhost:7878/store?graph=urn%3Acartoql%3Ashard%3Atyping' \
            -H 'content-type: text/turtle' --data-binary @corpus/shards/typing/data.ttl
      - name: Build the field console (packages/ui)
        run: npm run -w @cartoql/ui build
      - run: npm run typecheck
      - run: npm run test
      - name: L0 parity suite (sparql-http vs reference, live Oxigraph)
        run: npm run -s test 2>&1 | grep -E "parity|L0" || echo "parity suite ran as part of npm test"
      - run: npm run corpus:check
