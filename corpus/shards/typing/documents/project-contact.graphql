# THE polymorphic field: interface field (name), __typename discrimination,
# and typed fragments per implementer — conditioned, not typed-away
query ProjectContact($iri: ID!) {
  project(iri: $iri) {
    title
    contact {
      __typename
      name
      ...personFields
      ...orgFields
    }
  }
}
fragment personFields on Person {
  personEmail: email
}
fragment orgFields on Organization {
  crewSize
}
